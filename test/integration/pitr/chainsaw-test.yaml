---
# Point-in-time recovery suite.
#
# End-to-end proof that PITR (async replication topology, a storage with
# pitr.enabled) can seed a brand-new multi-node Instance recovered to a point
# in time, i.e. that archived binary logs are actually replayed:
#   1. Deploy SeaweedFS (S3), which pre-creates the backup bucket.
#   2. Provision a replication source MariaDB with PITR enabled; the provider
#      reconciles a PointInTimeRecovery CR + base PhysicalBackup and turns on
#      binary log archival (MariaDB.spec.pointInTimeRecoveryRef).
#   3. Write row 42 and wait for the recovery window (base backup + archival).
#   4. Write row 43, record the server time as the recovery target, write row
#      44, and wait until binary log archival covers the target.
#   5. Seed a new 3-node replication Instance via spec.dataSource type
#      PointInTime (recoveryTarget date); the provider wires
#      MariaDB.spec.bootstrapFrom.pointInTimeRecoveryRef.
#   6. Assert the recovered cluster comes up Ready with DataSourceReady, and
#      every node holds rows 42 and 43 but not 44 (written after the target).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pitr
spec:
  description: |
    Point-in-time recovery of a replication source Instance: enable PITR, archive
    binary logs to SeaweedFS, then recover into a new 3-node Instance via
    spec.dataSource (PointInTime, date), verifying binary logs are replayed up to
    the target on every node.

  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,mariadb,pointintimerecovery,physicalbackup,pods -o wide
    - script:
        content: kubectl -n $NAMESPACE get pointintimerecovery,physicalbackup,mariadb -o yaml
    - script:
        content: |
          ns=$(kubectl get deploy -A -l app.kubernetes.io/name=provider-mariadb \
            -o jsonpath='{.items[0].metadata.namespace}')
          [ -n "$ns" ] && kubectl -n "$ns" logs -l app.kubernetes.io/name=provider-mariadb \
            --all-containers --tail 200 || echo "provider deployment not found"

  steps:
    - name: provider-deployed
      try:
        - script:
            content: |
              set -eu
              avail=$(kubectl get deploy -A -l app.kubernetes.io/name=provider-mariadb \
                -o jsonpath='{.items[*].status.availableReplicas}')
              echo "provider available replicas: ${avail:-0}"
              echo "${avail}" | grep -q '[1-9]'

    # Deploy the shared SeaweedFS (idempotent); it pre-creates the backup bucket.
    - name: setup-seaweedfs
      timeouts:
        exec: 4m
      try:
        - script:
            content: |
              set -eu
              kubectl apply -f "${PROVIDER_ROOT_PATH}/dev/resources/seaweedfs.yaml"
              kubectl -n seaweedfs rollout status deploy/seaweedfs --timeout=180s

    - name: backup-storage
      try:
        - apply:
            file: 10-backupstorage.yaml

    - name: source-instance
      try:
        - apply:
            file: 20-source-instance.yaml
        - assert:
            file: 20-assert.yaml

    - name: source-running
      timeouts:
        assert: 10m
      try:
        - assert:
            file: 21-assert.yaml

    # The provider wired PITR: CR, base backup and the MariaDB reference.
    - name: pitr-configured
      timeouts:
        assert: 5m
      try:
        - assert:
            file: 30-assert.yaml

    # Write a sentinel row that must survive recovery. Enabling PITR triggers a
    # rolling update, and connecting to the replication primary as the everest
    # user is unreliable, so write as root via the primary pod's local socket
    # (root's password comes from the instance's own root Secret). Retry to ride
    # out the rollout; FLUSH BINARY LOGS forces the write into an archived binlog.
    - name: seed-data
      timeouts:
        exec: 12m
      try:
        - script:
            content: |
              set -eu
              rootpw=$(kubectl -n "$NAMESPACE" get secret everest-secrets-pitr-source-root \
                -o jsonpath='{.data.root-password}' | base64 -d)
              ok=0
              for attempt in $(seq 1 40); do
                primary=$(kubectl -n "$NAMESPACE" get pod -l 'k8s.mariadb.com/role=primary' \
                  -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                if [ -n "$primary" ] && kubectl -n "$NAMESPACE" exec "$primary" -c mariadb -- \
                  env MYSQL_PWD="$rootpw" mariadb -u root -e \
                  "CREATE TABLE IF NOT EXISTS everest.pitr_probe (id INT PRIMARY KEY); INSERT INTO everest.pitr_probe (id) VALUES (42) ON DUPLICATE KEY UPDATE id=id; FLUSH BINARY LOGS;"; then
                  echo "seeded via ${primary}"
                  ok=1; break
                fi
                echo "seed attempt ${attempt} failed (primary not ready?); retrying in 15s..."
                sleep 15
              done
              [ "$ok" = 1 ]

    # Wait for the base backup + binlog archival so a recovery window exists.
    - name: recovery-window-available
      timeouts:
        assert: 12m
      try:
        - assert:
            file: 40-assert.yaml

    # Writes after the base backup, around the recovery target. Only replaying
    # the archived binary logs can bring back row 43; row 44 is past the target.
    # Base backups run every 5 minutes, so the writes are timed between one
    # completed base backup and the next. Times come from the server clock to
    # avoid runner/cluster skew.
    - name: write-around-target
      timeouts:
        exec: 8m
      try:
        - script:
            content: |
              set -eu
              rootpw=$(kubectl -n "$NAMESPACE" get secret everest-secrets-pitr-source-root \
                -o jsonpath='{.data.root-password}' | base64 -d)
              primary=$(kubectl -n "$NAMESPACE" get pod -l 'k8s.mariadb.com/role=primary' \
                -o jsonpath='{.items[0].metadata.name}')
              sql() {
                kubectl -n "$NAMESPACE" exec "$primary" -c mariadb -- \
                  env MYSQL_PWD="$rootpw" mariadb -u root -Nse "$1"
              }
              # Wait for 60-240s past a 5-minute boundary (server time).
              while :; do
                offset=$(sql "SELECT MOD(UNIX_TIMESTAMP(), 300);")
                if [ "$offset" -ge 60 ] && [ "$offset" -lt 240 ]; then break; fi
                sleep 10
              done
              sql "INSERT INTO everest.pitr_probe (id) VALUES (43);"
              sleep 3
              target=$(sql "SELECT DATE_FORMAT(UTC_TIMESTAMP(), '%Y-%m-%dT%H:%i:%sZ');")
              sleep 3
              sql "INSERT INTO everest.pitr_probe (id) VALUES (44); FLUSH BINARY LOGS;"
              kubectl -n "$NAMESPACE" create configmap pitr-target --from-literal=target="$target"
              echo "recovery target: $target"

    # Binary logs are archived periodically; wait until the recoverable window
    # covers the target. Both timestamps are RFC 3339 UTC, so they compare as
    # strings.
    - name: target-archived
      timeouts:
        exec: 20m
      try:
        - script:
            content: |
              set -eu
              target=$(kubectl -n "$NAMESPACE" get configmap pitr-target -o jsonpath='{.data.target}')
              for attempt in $(seq 1 75); do
                latest=$(kubectl -n "$NAMESPACE" get instance pitr-source \
                  -o jsonpath='{.status.backup.storages[0].pitr.latestRestorableTime}')
                echo "latestRestorableTime=${latest:-<none>} target=${target}"
                if [ -n "$latest" ] && awk -v a="$latest" -v b="$target" 'BEGIN { exit !(a > b) }'; then
                  exit 0
                fi
                sleep 15
              done
              exit 1

    # Recover a brand-new 3-node replication Instance to the target.
    - name: recover-instance
      try:
        - script:
            content: |
              set -eu
              target=$(kubectl -n "$NAMESPACE" get configmap pitr-target -o jsonpath='{.data.target}')
              sed "s/__TARGET__/${target}/" 50-restore-instance.yaml | kubectl -n "$NAMESPACE" apply -f -
        - assert:
            file: 50-assert.yaml

    - name: recovered-running
      timeouts:
        assert: 20m
      try:
        - assert:
            file: 51-assert.yaml

    # Every node must hold the rows up to the target and nothing after it: the
    # primary proves the replay stopped at the target, the replicas prove they
    # replicate from the recovered primary. Read as root via each pod's local
    # socket (the provider copied the source's root Secret onto the restored
    # instance). Retry to ride out replication catching up.
    - name: verify-data
      timeouts:
        exec: 5m
      try:
        - script:
            content: |
              set -eu
              rootpw=$(kubectl -n "$NAMESPACE" get secret everest-secrets-pitr-restored-root \
                -o jsonpath='{.data.root-password}' | base64 -d)
              for pod in pitr-restored-0 pitr-restored-1 pitr-restored-2; do
                ok=0
                for attempt in $(seq 1 12); do
                  out=$(kubectl -n "$NAMESPACE" exec "$pod" -c mariadb -- \
                    env MYSQL_PWD="$rootpw" mariadb -u root -Nse \
                    "SELECT GROUP_CONCAT(id ORDER BY id) FROM everest.pitr_probe;" 2>&1 || true)
                  echo "${pod}: ${out}"
                  if [ "$out" = "42,43" ]; then
                    ok=1; break
                  fi
                  sleep 15
                done
                [ "$ok" = 1 ] || { echo "${pod}: expected rows 42,43, got '${out}'"; exit 1; }
              done

    - name: delete-instances
      try:
        - delete:
            ref:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              name: pitr-restored
        - delete:
            ref:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              name: pitr-source
        - wait:
            apiVersion: k8s.mariadb.com/v1alpha1
            kind: MariaDB
            name: pitr-source
            timeout: 3m
            for:
              deletion: {}
