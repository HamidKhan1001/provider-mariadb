# A brand-new 3-node replication Instance seeded by point-in-time recovery:
# restore the source's full base backup and replay archived binary logs up to
# the target date (__TARGET__ is substituted by the test). The provider sets
# MariaDB.spec.bootstrapFrom.pointInTimeRecoveryRef. backup must be enabled with
# the same storage the source stream uses (required by the dataSource
# validation).
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: pitr-restored
spec:
  providerRef:
    name: mariadb
  dataSource:
    type: PointInTime
    pointInTime:
      source:
        instanceRef:
          name: pitr-source
        storageRef:
          name: seaweedfs-s3
      recoveryTarget: date
      date: __TARGET__
  topology:
    type: replication
  components:
    engine:
      type: mariadb
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 1G
        requests:
          cpu: 250m
          memory: 512M
      storage:
        size: 1Gi
  backup:
    enabled: true
    classRef:
      name: mariadb
    storages:
      - storageRef:
          name: seaweedfs-s3
