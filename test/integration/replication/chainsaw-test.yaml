---
# Async replication HA suite.
#
# Provisions a real 3-node primary/replica cluster through the bundled
# mariadb-operator, waits for it to become Running, and verifies that a client
# can authenticate through the primary Service using the credentials published
# in the connection Secret. It then scales the cluster out to 4 nodes, seeding
# the new replica from a physical backup staged in the Instance's backup storage
# (SeaweedFS), and checks every node replicates. It then breaks a replica (its
# binary logs are purged on the primary) and checks the operator rebuilds it.
# Finally it tears the Instance down and asserts the MariaDB CR is
# garbage-collected.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: replication
spec:
  description: |
    Create a replication Instance, wait for a real 3-node MariaDB cluster to come
    up, connect to it through the primary Service with the generated
    login/password, scale it out to 4 nodes, break a replica and check it is
    recovered automatically, then delete it.

  # Collect diagnostics when a step fails.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,mariadb,physicalbackup,pods,svc,pdb -o wide
    - script:
        content: kubectl -n $NAMESPACE get mariadb,physicalbackup -o yaml
    - script:
        content: |
          ns=$(kubectl get deploy -A -l app.kubernetes.io/name=provider-mariadb \
            -o jsonpath='{.items[0].metadata.namespace}')
          [ -n "$ns" ] && kubectl -n "$ns" logs -l app.kubernetes.io/name=provider-mariadb \
            --all-containers --tail 100 || echo "provider deployment not found"

  steps:
    - name: provider-deployed
      try:
        - script:
            content: |
              set -eu
              # Provider is installed in provider-system (CI) or default (plugin-hub);
              # assert an available replica regardless of namespace.
              avail=$(kubectl get deploy -A -l app.kubernetes.io/name=provider-mariadb \
                -o jsonpath='{.items[*].status.availableReplicas}')
              echo "provider available replicas: ${avail:-0}"
              echo "${avail}" | grep -q '[1-9]'

    # Deploy the shared SeaweedFS (idempotent): the backup storage stages the
    # physical backup that seeds new replicas on scale-out.
    - name: setup-seaweedfs
      timeouts:
        exec: 4m
      try:
        - script:
            content: |
              set -eu
              kubectl apply -f "${PROVIDER_ROOT_PATH}/dev/resources/seaweedfs.yaml"
              kubectl -n seaweedfs rollout status deploy/seaweedfs --timeout=180s

    - name: backup-storage
      try:
        - apply:
            file: 05-backupstorage.yaml

    - name: create-instance
      try:
        - apply:
            file: 10-create-instance.yaml
        - assert:
            file: 10-assert.yaml

    # Bootstrapping a real 3-node replication cluster (StatefulSet + PVCs +
    # primary election + replica configuration) takes a while, so give the
    # readiness assertion a generous timeout.
    - name: cluster-running
      timeouts:
        assert: 12m
      try:
        - assert:
            file: 11-assert.yaml

    # Authenticate against the running cluster through the primary Service using
    # the credentials published in the connection Secret. A throwaway client pod
    # runs SELECT 1; a failure (including an empty password) fails the step.
    - name: connect
      timeouts:
        exec: 3m
      try:
        - script:
            content: |
              set -eu
              secret="test-replication-conn"

              user=$(kubectl -n "$NAMESPACE" get secret "$secret" -o jsonpath='{.data.username}' | base64 -d)
              pass=$(kubectl -n "$NAMESPACE" get secret "$secret" -o jsonpath='{.data.password}' | base64 -d)
              host=$(kubectl -n "$NAMESPACE" get secret "$secret" -o jsonpath='{.data.host}' | base64 -d)
              port=$(kubectl -n "$NAMESPACE" get secret "$secret" -o jsonpath='{.data.port}' | base64 -d)

              if [ -z "$pass" ]; then
                echo "FAIL: connection secret '$secret' has an empty password" >&2
                exit 1
              fi
              echo "connecting as '$user' to $host:$port"

              # Mount the CA copied into the OpenEverest connection Secret,
              # verify the primary Service certificate, and prove TLS was negotiated.
              kubectl -n "$NAMESPACE" run mariadb-replication-conn-check \
                --rm -i --restart=Never \
                --image=mariadb:12.3 \
                --overrides='{
                  "spec": {
                    "containers": [{
                      "name": "mariadb-replication-conn-check",
                      "image": "mariadb:12.3",
                      "command": ["sh", "-c"],
                      "args": ["set -eu; cipher=$(mariadb -h \"$DB_HOST\" -P \"$DB_PORT\" -u \"$DB_USER\" --ssl-ca=/tls/ca.crt --ssl-verify-server-cert -Nse \"SHOW STATUS LIKE '\''Ssl_cipher'\'';\" | awk '\''{print $2}'\''); test -n \"$cipher\"; echo \"TLS cipher: $cipher\""],
                      "env": [
                        {"name": "DB_HOST", "valueFrom": {"secretKeyRef": {"name": "test-replication-conn", "key": "host"}}},
                        {"name": "DB_PORT", "valueFrom": {"secretKeyRef": {"name": "test-replication-conn", "key": "port"}}},
                        {"name": "DB_USER", "valueFrom": {"secretKeyRef": {"name": "test-replication-conn", "key": "username"}}},
                        {"name": "MYSQL_PWD", "valueFrom": {"secretKeyRef": {"name": "test-replication-conn", "key": "password"}}}
                      ],
                      "volumeMounts": [{"name": "tls", "mountPath": "/tls", "readOnly": true}]
                    }],
                    "volumes": [{"name": "tls", "secret": {"secretName": "test-replication-conn", "items": [{"key": "ca.crt", "path": "ca.crt"}]}}]
                  }
                }'

    # Write a row before scaling out; the new replica must receive it through
    # the seeding backup, and later writes through replication. Written as root
    # via the primary pod's local socket.
    - name: seed-data
      timeouts:
        exec: 3m
      try:
        - script:
            content: |
              set -eu
              rootpw=$(kubectl -n "$NAMESPACE" get secret everest-secrets-test-replication-root \
                -o jsonpath='{.data.root-password}' | base64 -d)
              primary=$(kubectl -n "$NAMESPACE" get mariadb test-replication -o jsonpath='{.status.currentPrimary}')
              kubectl -n "$NAMESPACE" exec "$primary" -c mariadb -- env MYSQL_PWD="$rootpw" mariadb -u root -e \
                "CREATE TABLE IF NOT EXISTS everest.scale_probe (id INT PRIMARY KEY); INSERT INTO everest.scale_probe (id) VALUES (1);"

    - name: scale-out
      timeouts:
        assert: 2m
      try:
        - patch:
            file: 30-scale-out.yaml
        - assert:
            file: 30-assert.yaml

    - name: scaled-out
      timeouts:
        assert: 15m
      try:
        - assert:
            file: 31-assert.yaml

    # Every node, including the new one, holds the row written before the
    # scale-out and one written after it.
    - name: verify-replication
      timeouts:
        exec: 5m
      try:
        - script:
            content: |
              set -eu
              rootpw=$(kubectl -n "$NAMESPACE" get secret everest-secrets-test-replication-root \
                -o jsonpath='{.data.root-password}' | base64 -d)
              primary=$(kubectl -n "$NAMESPACE" get mariadb test-replication -o jsonpath='{.status.currentPrimary}')
              kubectl -n "$NAMESPACE" exec "$primary" -c mariadb -- env MYSQL_PWD="$rootpw" mariadb -u root -e \
                "INSERT INTO everest.scale_probe (id) VALUES (2);"
              for i in 0 1 2 3; do
                ok=0
                for attempt in $(seq 1 12); do
                  out=$(kubectl -n "$NAMESPACE" exec "test-replication-$i" -c mariadb -- \
                    env MYSQL_PWD="$rootpw" mariadb -u root -Nse \
                    "SELECT GROUP_CONCAT(id ORDER BY id) FROM everest.scale_probe;" 2>&1 || true)
                  echo "test-replication-$i: ${out}"
                  if [ "$out" = "1,2" ]; then ok=1; break; fi
                  sleep 10
                done
                [ "$ok" = 1 ] || { echo "test-replication-$i: expected rows 1,2"; exit 1; }
              done

    # Break a replica: while its replication is stopped, the primary purges the
    # binary logs it still needs, so restarting replication fails with error
    # 1236. The operator must rebuild it from a physical backup of the cluster.
    - name: break-replica
      timeouts:
        exec: 3m
      try:
        - script:
            content: |
              set -eu
              rootpw=$(kubectl -n "$NAMESPACE" get secret everest-secrets-test-replication-root \
                -o jsonpath='{.data.root-password}' | base64 -d)
              sql() {
                kubectl -n "$NAMESPACE" exec "$1" -c mariadb -- env MYSQL_PWD="$rootpw" mariadb -u root -Nse "$2"
              }
              primary=$(kubectl -n "$NAMESPACE" get mariadb test-replication -o jsonpath='{.status.currentPrimary}')
              for i in 0 1 2 3; do
                if [ "test-replication-$i" != "$primary" ]; then replica="test-replication-$i"; break; fi
              done
              sql "$replica" "STOP SLAVE;"
              sql "$primary" "INSERT INTO everest.scale_probe (id) VALUES (3); FLUSH BINARY LOGS;"
              current=$(sql "$primary" "SHOW MASTER STATUS;" | awk '{print $1}')
              sql "$primary" "PURGE BINARY LOGS TO '${current}'; INSERT INTO everest.scale_probe (id) VALUES (4);"
              sql "$replica" "START SLAVE;"
              kubectl -n "$NAMESPACE" create configmap broken-replica --from-literal=pod="$replica"
              echo "broke ${replica} (primary ${primary}, binlogs purged up to ${current})"

    - name: replica-recovered
      timeouts:
        assert: 15m
      try:
        - assert:
            file: 40-assert.yaml

    # The rebuilt replica holds every row, including those only present in the
    # purged binary logs.
    - name: verify-recovered-replica
      timeouts:
        exec: 5m
      try:
        - script:
            content: |
              set -eu
              rootpw=$(kubectl -n "$NAMESPACE" get secret everest-secrets-test-replication-root \
                -o jsonpath='{.data.root-password}' | base64 -d)
              replica=$(kubectl -n "$NAMESPACE" get configmap broken-replica -o jsonpath='{.data.pod}')
              for attempt in $(seq 1 18); do
                out=$(kubectl -n "$NAMESPACE" exec "$replica" -c mariadb -- env MYSQL_PWD="$rootpw" mariadb -u root -Nse \
                  "SELECT GROUP_CONCAT(id ORDER BY id) FROM everest.scale_probe;" 2>&1 || true)
                echo "${replica}: ${out}"
                if [ "$out" = "1,2,3,4" ]; then exit 0; fi
                sleep 10
              done
              exit 1

    - name: delete-instance
      try:
        - delete:
            ref:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              name: test-replication
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-replication
            timeout: 2m
            for:
              deletion: {}
        - wait:
            apiVersion: k8s.mariadb.com/v1alpha1
            kind: MariaDB
            name: test-replication
            timeout: 3m
            for:
              deletion: {}
