# A 3-node async replication MariaDB Instance used by the replication HA suite.
# The backup storage stages the physical backup used to seed new replicas when
# scaling out; no backups are scheduled.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-replication
spec:
  providerRef:
    name: mariadb
  topology:
    type: replication
  components:
    engine:
      type: mariadb
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 1G
        requests:
          cpu: 250m
          memory: 512M
      storage:
        size: 1Gi
  backup:
    enabled: true
    classRef:
      name: mariadb
    storages:
      - storageRef:
          name: seaweedfs-s3
