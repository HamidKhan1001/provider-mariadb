---
# Core connectivity suite.
#
# Provisions a real single-node MariaDB through the bundled mariadb-operator,
# waits for it to become Running, and verifies that a client can authenticate
# with the credentials published in the connection Secret. Finally it tears the
# Instance down and asserts the MariaDB CR is garbage-collected.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: core
spec:
  description: |
    Create an Instance, wait for a real MariaDB to come up, connect to it with
    the generated login/password, then delete it.

  # Collect diagnostics when a step fails.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,mariadb,pods -o wide
    - script:
        content: kubectl -n $NAMESPACE get mariadb,user -o yaml
    # The provider may live in any namespace (provider-system in CI, default in
    # a plugin-hub install), so locate it by label before tailing its logs.
    - script:
        content: |
          ns=$(kubectl get deploy -A -l app.kubernetes.io/name=provider-mariadb \
            -o jsonpath='{.items[0].metadata.namespace}')
          [ -n "$ns" ] && kubectl -n "$ns" logs -l app.kubernetes.io/name=provider-mariadb \
            --all-containers --tail 100 || echo "provider deployment not found"

  steps:
    - name: provider-deployed
      try:
        - script:
            content: |
              set -eu
              # Provider is installed in provider-system (CI) or default (plugin-hub);
              # assert an available replica regardless of namespace.
              avail=$(kubectl get deploy -A -l app.kubernetes.io/name=provider-mariadb \
                -o jsonpath='{.items[*].status.availableReplicas}')
              echo "provider available replicas: ${avail:-0}"
              echo "${avail}" | grep -q '[1-9]'

    - name: create-instance
      try:
        - apply:
            file: 10-create-instance.yaml
        - assert:
            file: 10-assert.yaml

    # Provisioning a real MariaDB (StatefulSet + PVC + bootstrap) takes a while,
    # so give the readiness assertion a generous timeout.
    - name: instance-running
      timeouts:
        assert: 8m
      try:
        - assert:
            file: 11-assert.yaml

    # Authenticate against the running database using the credentials published
    # in the connection Secret. A throwaway client pod runs SELECT 1; a failure
    # (including an empty password) fails the step.
    - name: connect
      timeouts:
        exec: 3m
      try:
        - script:
            content: |
              set -eu
              secret="test-instance-conn"

              user=$(kubectl -n "$NAMESPACE" get secret "$secret" -o jsonpath='{.data.username}' | base64 -d)
              pass=$(kubectl -n "$NAMESPACE" get secret "$secret" -o jsonpath='{.data.password}' | base64 -d)
              host=$(kubectl -n "$NAMESPACE" get secret "$secret" -o jsonpath='{.data.host}' | base64 -d)
              port=$(kubectl -n "$NAMESPACE" get secret "$secret" -o jsonpath='{.data.port}' | base64 -d)

              if [ -z "$pass" ]; then
                echo "FAIL: connection secret '$secret' has an empty password" >&2
                exit 1
              fi
              echo "connecting as '$user' to $host:$port"

              # Mount the CA copied into the OpenEverest connection Secret,
              # verify the server certificate, and prove TLS was negotiated.
              kubectl -n "$NAMESPACE" run mariadb-conn-check \
                --rm -i --restart=Never \
                --image=mariadb:12.3 \
                --overrides='{
                  "spec": {
                    "containers": [{
                      "name": "mariadb-conn-check",
                      "image": "mariadb:12.3",
                      "command": ["sh", "-c"],
                      "args": ["set -eu; cipher=$(mariadb -h \"$DB_HOST\" -P \"$DB_PORT\" -u \"$DB_USER\" --ssl-ca=/tls/ca.crt --ssl-verify-server-cert -Nse \"SHOW STATUS LIKE '\''Ssl_cipher'\'';\" | awk '\''{print $2}'\''); test -n \"$cipher\"; echo \"TLS cipher: $cipher\""],
                      "env": [
                        {"name": "DB_HOST", "valueFrom": {"secretKeyRef": {"name": "test-instance-conn", "key": "host"}}},
                        {"name": "DB_PORT", "valueFrom": {"secretKeyRef": {"name": "test-instance-conn", "key": "port"}}},
                        {"name": "DB_USER", "valueFrom": {"secretKeyRef": {"name": "test-instance-conn", "key": "username"}}},
                        {"name": "MYSQL_PWD", "valueFrom": {"secretKeyRef": {"name": "test-instance-conn", "key": "password"}}}
                      ],
                      "volumeMounts": [{"name": "tls", "mountPath": "/tls", "readOnly": true}]
                    }],
                    "volumes": [{"name": "tls", "secret": {"secretName": "test-instance-conn", "items": [{"key": "ca.crt", "path": "ca.crt"}]}}]
                  }
                }'

    # Downgrading a running Instance to an older MariaDB version is rejected:
    # its data directory has been upgraded by the newer server. Updates made
    # outside the OpenEverest API bypass admission, so the provider blocks the
    # Instance (Ready=False, ValidationFailed) and leaves the cluster untouched.
    - name: reject-downgrade
      timeouts:
        assert: 2m
      try:
        - patch:
            resource:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              metadata:
                name: test-instance
              spec:
                version: "10.11"
        - assert:
            file: 12-assert.yaml

    # Going back to the current version unblocks the Instance.
    - name: revert-downgrade
      timeouts:
        assert: 3m
      try:
        - patch:
            resource:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              metadata:
                name: test-instance
              spec:
                version: "12.3"
        - assert:
            file: 13-assert.yaml

    - name: delete-instance
      try:
        - delete:
            ref:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              name: test-instance
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-instance
            timeout: 2m
            for:
              deletion: {}
        - wait:
            apiVersion: k8s.mariadb.com/v1alpha1
            kind: MariaDB
            name: test-instance
            timeout: 3m
            for:
              deletion: {}
