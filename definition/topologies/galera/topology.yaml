# Galera topology definition: a multi-master MariaDB cluster for HA.
# Galera requires an odd number of nodes (>= 3) to maintain quorum and avoid
# split-brain. The provider defaults new clusters to 3 nodes.

config:
  parametersSchema: GaleraTopologyParameters
  components:
    engine:
      defaults:
        replicas: 3
      supportedFields:
        properties:
          storage: {}
          resources: {}
          replicas: {}
          service: {}
          schedulingPolicy:
            # schedulerName has no MariaDB operator counterpart.
            properties:
              affinity: {}
              nodeSelector: {}
              tolerations: {}
              topologySpreadConstraints: {}
    monitoring:
      optional: true
      supportedFields:
        properties:
          resources: {}
    proxy:
      optional: true
      supportedFields:
        properties:
          resources: {}
          replicas: {}
          service: {}
          schedulingPolicy:
            properties:
              affinity: {}
              nodeSelector: {}
              tolerations: {}
              topologySpreadConstraints: {}

ui:
  sections:
    databaseVersion:
      label: "Database Version"
      description: "Select the MariaDB version to deploy."
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: "Database Version"
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: "name"
              valuePath: "name"
            modes:
              edit:
                disabled: true
              restore:
                disabled: true
          validation:
            required: true

    resources:
      label: "Resources"
      description: "Configure the CPU, memory, and storage for each Galera node."
      components:
        nodes:
          uiType: group
          components:
            numberOfNodes:
              path: "spec.components.engine.replicas"
              uiType: number
              fieldParams:
                label: "Number of nodes"
                defaultValue: 3
              validation:
                required: true
                min: 3
                int: true
                celExpressions:
                  - celExpr: "spec.components.engine.replicas % 2 == 1"
                    message: "Galera requires an odd number of nodes to avoid split-brain"

            resources:
              uiType: group
              groupType: line
              components:
                cpu:
                  path: "spec.components.engine.resources.limits.cpu"
                  uiType: number
                  fieldParams:
                    label: "CPU"
                    defaultValue: 1
                    step: 1
                  validation:
                    min: 0.5
                    required: true
                memory:
                  path: "spec.components.engine.resources.limits.memory"
                  uiType: number
                  fieldParams:
                    label: "Memory"
                    defaultValue: 2
                    step: 0.5
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 0.5
                    required: true
                disk:
                  path: "spec.components.engine.storage.size"
                  uiType: number
                  fieldParams:
                    label: "Disk"
                    defaultValue: 10
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 1
                    int: true
                    required: true
                    modes:
                      edit:
                        celExpressions:
                          - celExpr: "spec.components.engine.storage.size >= original.spec.components.engine.storage.size"
                            message: "Disk size cannot be decreased"
          componentsOrder:
            - numberOfNodes
            - resources

    monitoring:
      label: "Monitoring"
      description: "Expose database metrics and integrate them with a Prometheus or VictoriaMetrics stack."
      components:
        enabled:
          uiType: toggle
          path: spec.components.monitoring.parameters.enabled
          fieldParams:
            label: "Enable metrics"
            helperText: "Deploys the metrics exporter and a Prometheus ServiceMonitor. Requires the Prometheus Operator CRDs."
            defaultValue: false
        victoriaMetrics:
          uiType: toggle
          path: spec.components.monitoring.parameters.victoriaMetrics.enabled
          fieldParams:
            label: "VictoriaMetrics"
            helperText: "Also creates a VMServiceScrape for the VictoriaMetrics operator. Requires metrics to be enabled."
            defaultValue: false
      componentsOrder:
        - enabled
        - victoriaMetrics

    proxy:
      label: "Proxy"
      description: "Route client traffic through MariaDB MaxScale, which balances connections across nodes."
      components:
        enabled:
          uiType: toggle
          path: spec.components.proxy.parameters.enabled
          fieldParams:
            label: "Enable MaxScale"
            defaultValue: false
        replicas:
          uiType: number
          path: spec.components.proxy.replicas
          fieldParams:
            label: "Number of proxies"
            defaultValue: 2
          validation:
            min: 1
            int: true
        externalAccess:
          uiType: select
          path: spec.components.proxy.service.serviceType
          fieldParams:
            label: "External access"
            defaultValue: "ClusterIP"
            options:
              - label: "ClusterIP"
                value: "ClusterIP"
              - label: "LoadBalancer"
                value: "LoadBalancer"
              - label: "NodePort"
                value: "NodePort"
      componentsOrder:
        - enabled
        - replicas
        - externalAccess

    security:
      label: "Security"
      description: "Configure encryption for MariaDB client traffic and Galera state transfers."
      components:
        tlsEnabled:
          uiType: select
          path: spec.components.engine.parameters.tls.enabled
          fieldParams:
            label: "Enable TLS"
            defaultValue: "true"
            options:
              - label: "Enabled"
                value: "true"
              - label: "Disabled"
                value: "false"
        tlsRequired:
          uiType: select
          path: spec.components.engine.parameters.tls.required
          fieldParams:
            label: "Require encrypted connections"
            helperText: "Reject clients that do not connect using TLS. Enable only after all clients trust the published CA."
            defaultValue: "false"
            options:
              - label: "Optional"
                value: "false"
              - label: "Required"
                value: "true"
        galeraSSTEnabled:
          uiType: select
          path: spec.components.engine.parameters.tls.galeraSSTEnabled
          fieldParams:
            label: "Encrypt Galera state transfers"
            defaultValue: "true"
            options:
              - label: "Enabled"
                value: "true"
              - label: "Disabled"
                value: "false"
      componentsOrder:
        - tlsEnabled
        - tlsRequired
        - galeraSSTEnabled

    advanced:
      label: "Advanced configuration"
      description: "Configure storage class and optional MariaDB settings."
      components:
        storageClass:
          uiType: select
          path: spec.components.engine.storage.storageClass
          fieldParams:
            label: "Storage class"
            modes:
              edit:
                disabled: true
          dataSource:
            provider: storageClasses
        externalAccess:
          uiType: select
          path: spec.components.engine.service.serviceType
          fieldParams:
            label: "External access"
            defaultValue: "ClusterIP"
            options:
              - label: "ClusterIP"
                value: "ClusterIP"
              - label: "LoadBalancer"
                value: "LoadBalancer"
              - label: "NodePort"
                value: "NodePort"
        configuration:
          uiType: text
          path: spec.components.engine.parameters.configuration
          fieldParams:
            label: "Engine configuration (my.cnf)"
            placeholder: |
              [mariadb]
              max_connections=100
            multiline: true
            minRows: 3
            maxRows: 8
        podSchedulingPolicy:
          uiType: group
          groupType: toggleable
          label: "Pod scheduling policy"
          components:
            policy:
              uiType: widget
              widgetType: podSchedulingPolicy
      componentsOrder:
        - storageClass
        - externalAccess
        - configuration
        - podSchedulingPolicy

  sectionsOrder:
    - databaseVersion
    - resources
    - monitoring
    - proxy
    - security
    - advanced
